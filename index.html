<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau Ingold</title>
<meta name="description" content="A brand and growth consultancy. Enquiries on request.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #13233F;
    --champagne: #C3A55C;
    --on-navy: #EFEADF;
    --on-navy-soft: rgba(239, 234, 223, .60);
    --gutter: clamp(1.6rem, 6vw, 5.5rem);
    --ease: cubic-bezier(.22, .61, .24, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--navy);
    color: var(--on-navy-soft);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(4rem, 12vh, 8rem) var(--gutter);
  }

  main {
    width: 100%;
    max-width: 74rem;
    margin-inline: auto;
  }

  .mark, .foot {
    font-size: .705rem;
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
  }

  .mark {
    color: var(--champagne);
    margin: 0 0 clamp(2.6rem, 6vw, 4.5rem);
  }

  h1 {
    margin: 0;
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.7rem, 6.4vw, 5.6rem);
    line-height: 1.07;
    letter-spacing: -.012em;
    color: var(--on-navy);
    max-width: 15ch;
    text-wrap: balance;
  }

  .rule {
    height: 1px;
    background: var(--champagne);
    opacity: .55;
    margin: clamp(2.8rem, 6vw, 4.2rem) 0 clamp(1.6rem, 3vw, 2.2rem);
    max-width: 7rem;
  }

  .foot { margin: 0; }

  .foot a {
    color: var(--on-navy-soft);
    text-decoration: none;
    transition: color .35s var(--ease);
  }

  .foot a:hover { color: var(--champagne); }

  :focus-visible { outline: 1px solid var(--champagne); outline-offset: 4px; }

  .mark, h1, .rule, .foot {
    opacity: 0;
    animation: rise 1.1s var(--ease) forwards;
  }

  h1     { animation-delay: .18s; }
  .rule  { animation-delay: .34s; }
  .foot  { animation-delay: .46s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark, h1, .rule, .foot { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body>

<main>
  <p class="mark">Bureau Ingold</p>
  <h1>A brand and growth&nbsp;consultancy.</h1>
  <div class="rule"></div>
  <p class="foot">
    Enquiries — <a href="mailto:hello@bureauingold.com">hello@bureauingold.com</a>
  </p>
</main>

</body>
</html>
